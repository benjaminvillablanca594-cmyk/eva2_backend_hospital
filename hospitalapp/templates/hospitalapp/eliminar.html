<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 500px;">
        <!-- border-danger dibuja un borde rojo alrededor de la tarjeta -->
        <div class="card shadow border-danger">
            <div class="card-body text-center p-5">
                
                <h1 class="text-danger mb-4">¡Atención!</h1>
                <p class="fs-5">
                    ¿Estás absolutamente seguro de que deseas eliminar los registros del paciente <br>
                    <strong>{{ paciente.nombre_completo }}</strong> (RUT: {{ paciente.rut }})?
                </p>
                <p class="text-muted small mb-4">Esta acción no se puede deshacer y los datos se borrarán permanentemente de la base de datos MySQL.</p>
                
                <!-- Este formulario no tiene inputs, su único propósito es enviar una petición POST
                     para que views.py ejecute la función paciente.delete() -->
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <!-- El botón cancelar es simplemente un enlace que te saca de aquí y no envía el form -->
                        <a href="{% url 'listar_pacientes' %}" class="btn btn-secondary px-4">No, volver a la lista</a>
                        <!-- El submit confirma la petición POST -->
                        <button type="submit" class="btn btn-danger px-4">Sí, eliminar paciente</button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</body>
</html>
